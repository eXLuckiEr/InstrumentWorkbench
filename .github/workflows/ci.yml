name: CI

# Every push to main and every pull request: the logic tests and a build on Linux, macOS and Windows.
# A tag "v*" additionally packs the macOS and Windows builds and prepares a DRAFT release on GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt of the CI builds. The project needs 6.5+; bump when install-qt-action offers a newer one.
  QT_VERSION: '6.8.*'

jobs:
  # Pure C++ tests (no Qt), a minute at most.
  tests:
    name: Logic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: plotcore_test
        run: |
          g++ -std=c++17 -O2 -Isdk/src tools/plotcore_test.cpp -o /tmp/plotcore_test
          /tmp/plotcore_test
      - name: historycore_test
        run: |
          g++ -std=c++17 -Wall -Wextra -Iplugins/device/console tools/historycore_test.cpp -o /tmp/historycore_test
          /tmp/historycore_test
      - name: cancore_test
        run: |
          g++ -std=c++17 -Wall -Wextra -Isdk/include -Iplugins/endpoint/canslcan tools/cancore_test.cpp -o /tmp/cancore_test
          /tmp/cancore_test
      - name: mkscore_test
        run: |
          g++ -std=c++17 -Wall -Wextra -Isdk/include -Iplugins/device/mksservo tools/mkscore_test.cpp -o /tmp/mkscore_test
          /tmp/mkscore_test
      - name: rp2040parse_test
        run: |
          g++ -std=c++17 -Wall -Wextra -Iplugins/device/rp2040 tools/rp2040parse_test.cpp -o /tmp/rp2040parse_test
          /tmp/rp2040parse_test
      - name: hwmoncore_test
        run: |
          g++ -std=c++17 -Wall -Wextra -Iplugins/device/hwmon tools/hwmoncore_test.cpp -o /tmp/hwmoncore_test
          /tmp/hwmoncore_test

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04,  qt_arch: '',                 pack: false }
          - { name: macOS,   os: macos-15,      qt_arch: '',                 pack: true }
          - { name: Windows, os: windows-2022,  qt_arch: win64_msvc2022_64,  pack: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version string
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # forward slashes: CMake and PowerShell take them everywhere
          rt="${RUNNER_TEMP//\\//}"
          echo "QK_ROOT=$rt/qtkeychain" >> "$GITHUB_ENV"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libsecret-1-dev libglib2.0-dev

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtserialport qtshadertools qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Passwords in the OS keychain. Built once per Qt version, then taken from the cache.
      - name: QtKeychain (cache)
        id: qk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qtkeychain
          key: qtkeychain-${{ runner.os }}-${{ env.QT_VERSION }}-v1

      - name: QtKeychain (build)
        if: steps.qk-cache.outputs.cache-hit != 'true'
        run: |
          rt="${RUNNER_TEMP//\\//}"
          git clone --depth 1 https://github.com/frankosterfeld/qtkeychain.git "$rt/qtkeychain-src"
          cmake -S "$rt/qtkeychain-src" -B "$rt/qtkeychain-build" \
                -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_INSTALL_PREFIX="$QK_ROOT"
          cmake --build "$rt/qtkeychain-build" --config Release --parallel 4
          cmake --install "$rt/qtkeychain-build" --config Release

      # Qt WebEngine and WebChannel are installed with Qt: the console's terminal tab is built.
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DQTKEYCHAIN_ROOT="$QK_ROOT"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Check the result
        run: |
          out=build/bin/Release
          ls -la "$out" "$out/plugins"
          n=$(ls "$out/plugins" | wc -l)
          echo "plugins: $n"
          [ "$n" -ge 10 ]
          ls "$out"/iwp_host* >/dev/null
          ls "$out"/iwp_askpass* >/dev/null

      - name: Pack (macOS)
        if: matrix.pack && runner.os == 'macOS'
        env:
          QTKEYCHAIN_ROOT: ${{ env.QK_ROOT }}
        run: tools/deploy_macos.sh build Release dist "$VERSION"

      - name: Pack (Windows)
        if: matrix.pack && runner.os == 'Windows'
        shell: pwsh
        env:
          QTKEYCHAIN_ROOT: ${{ env.QK_ROOT }}
        run: tools/deploy_windows.ps1 -BuildDir build -Config Release -OutDir dist -Version $env:VERSION

      - name: Upload the package
        if: matrix.pack
        uses: actions/upload-artifact@v4
        with:
          name: IWP-${{ matrix.name }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # Only for tags "v*": a draft release with the packages, to be checked and published by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
